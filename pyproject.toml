[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canasson"
version = "1.0.0"
description = "Système de prédiction hippique PMU : collecte, ML, ROI et génération de site statique."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "GitPython>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
canasson = "canasson.cli:main"

[tool.setuptools.packages.find]
include = ["canasson*"]

[tool.setuptools.package-data]
"canasson.site" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
